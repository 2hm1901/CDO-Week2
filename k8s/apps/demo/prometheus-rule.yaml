apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cdo-demo-slo
  namespace: cdo-demo
  labels:
    # Prometheus Operator chỉ nạp rule có label khớp Helm release.
    release: kube-prometheus-stack
spec:
  groups:
    - name: cdo-demo.slo
      rules:
        # Availability SLO 99% nghĩa là error budget 1%.
        - record: cdo_demo:availability_error_ratio:5m
          expr: |
            sum(rate(http_requests_total{namespace="cdo-demo",status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{namespace="cdo-demo"}[5m]))
        - record: cdo_demo:availability_error_ratio:30m
          expr: |
            sum(rate(http_requests_total{namespace="cdo-demo",status=~"5.."}[30m]))
            /
            sum(rate(http_requests_total{namespace="cdo-demo"}[30m]))
        - record: cdo_demo:availability_error_ratio:1h
          expr: |
            sum(rate(http_requests_total{namespace="cdo-demo",status=~"5.."}[1h]))
            /
            sum(rate(http_requests_total{namespace="cdo-demo"}[1h]))
        - record: cdo_demo:availability_error_ratio:6h
          expr: |
            sum(rate(http_requests_total{namespace="cdo-demo",status=~"5.."}[6h]))
            /
            sum(rate(http_requests_total{namespace="cdo-demo"}[6h]))
        # Latency SLO 95% request <= 500 ms, nên latency error budget là 5%.
        - record: cdo_demo:latency_error_ratio:5m
          expr: |
            (
              sum(rate(http_request_duration_seconds_count{namespace="cdo-demo"}[5m]))
              -
              sum(rate(http_request_duration_seconds_bucket{namespace="cdo-demo",le="0.5"}[5m]))
            )
            /
            sum(rate(http_request_duration_seconds_count{namespace="cdo-demo"}[5m]))
        - record: cdo_demo:latency_error_ratio:30m
          expr: |
            (
              sum(rate(http_request_duration_seconds_count{namespace="cdo-demo"}[30m]))
              -
              sum(rate(http_request_duration_seconds_bucket{namespace="cdo-demo",le="0.5"}[30m]))
            )
            /
            sum(rate(http_request_duration_seconds_count{namespace="cdo-demo"}[30m]))
        - record: cdo_demo:latency_error_ratio:1h
          expr: |
            (
              sum(rate(http_request_duration_seconds_count{namespace="cdo-demo"}[1h]))
              -
              sum(rate(http_request_duration_seconds_bucket{namespace="cdo-demo",le="0.5"}[1h]))
            )
            /
            sum(rate(http_request_duration_seconds_count{namespace="cdo-demo"}[1h]))
        - record: cdo_demo:latency_error_ratio:6h
          expr: |
            (
              sum(rate(http_request_duration_seconds_count{namespace="cdo-demo"}[6h]))
              -
              sum(rate(http_request_duration_seconds_bucket{namespace="cdo-demo",le="0.5"}[6h]))
            )
            /
            sum(rate(http_request_duration_seconds_count{namespace="cdo-demo"}[6h]))
        - alert: CdoDemoAvailabilityFastBurn
          expr: |
            # Fast burn dùng 5m và 1h để bắt sự cố nghiêm trọng nhanh.
            cdo_demo:availability_error_ratio:5m > (14.4 * 0.01)
            and
            cdo_demo:availability_error_ratio:1h > (14.4 * 0.01)
          for: 2m
          labels:
            severity: critical
            slo: availability
          annotations:
            summary: CDO demo availability SLO fast burn
        - alert: CdoDemoAvailabilitySlowBurn
          expr: |
            # Slow burn dùng 30m và 6h để bắt lỗi âm ỉ nhưng kéo dài.
            cdo_demo:availability_error_ratio:30m > (6 * 0.01)
            and
            cdo_demo:availability_error_ratio:6h > (6 * 0.01)
          for: 15m
          labels:
            severity: warning
            slo: availability
          annotations:
            summary: CDO demo availability SLO slow burn
        - alert: CdoDemoLatencyFastBurn
          expr: |
            # 0.05 là error budget của latency SLO 95%.
            cdo_demo:latency_error_ratio:5m > (14.4 * 0.05)
            and
            cdo_demo:latency_error_ratio:1h > (14.4 * 0.05)
          for: 2m
          labels:
            severity: critical
            slo: latency
          annotations:
            summary: CDO demo latency SLO fast burn
        - alert: CdoDemoLatencySlowBurn
          expr: |
            cdo_demo:latency_error_ratio:30m > (6 * 0.05)
            and
            cdo_demo:latency_error_ratio:6h > (6 * 0.05)
          for: 15m
          labels:
            severity: warning
            slo: latency
          annotations:
            summary: CDO demo latency SLO slow burn
