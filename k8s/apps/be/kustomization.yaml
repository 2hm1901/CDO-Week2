apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kustomize gom các manifest của backend thành một desired state để ArgoCD apply.
resources:
- namespace.yaml
- deployment.yaml
- service.yaml
- service-monitor.yaml
- prometheus-rule.yaml

# GitHub Actions sẽ cập nhật image tag sau mỗi lần merge vào main.
images:
- name: cdo-be-app
  newName: ghcr.io/2hm1901/cdo-be-app
  newTag: 1c9f201eec58bcb6e3e1ee2752f2b991ecc38a6b
