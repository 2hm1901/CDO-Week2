apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cdo-be-app
  namespace: cdo-be
  labels:
    # Label này khớp selector mặc định trong kube-prometheus-stack values.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: cdo-be-app
  namespaceSelector:
    matchNames:
      - cdo-be
  endpoints:
    - port: http
      # App expose Prometheus metrics ở /metrics.
      path: /metrics
      interval: 15s
