apiVersion: apps/v1
kind: Deployment
metadata:
  name: cdo-be-app
  namespace: cdo-be
  labels:
    app: cdo-be-app
spec:
  # Dùng 2 replicas để có thể quan sát rollout và scale drift rõ hơn.
  replicas: a
  selector:
    matchLabels:
      app: cdo-be-app
  template:
    metadata:
      labels:
        app: cdo-be-app
    spec:
      containers:
        - name: app
          # Image logical name được Kustomize thay bằng GHCR image thật.
          image: cdo-be-app:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # Probe dùng endpoint nhẹ để Kubernetes kiểm tra readiness.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          # Resource nhỏ đủ cho lab nhưng vẫn giúp scheduler có request/limit rõ ràng.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
