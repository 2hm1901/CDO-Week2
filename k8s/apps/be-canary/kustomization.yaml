apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Overlay progressive delivery: dùng lại namespace/service/monitoring của BE base,
# xoá Deployment thường và thay bằng Argo Rollouts Rollout CRD.
resources:
  - ../be
  - analysis-template.yaml
  - rollout.yaml

patches:
  - path: delete-deployment.yaml

# GitHub Actions cập nhật tag này cùng lúc với k8s/apps/be/kustomization.yaml.
images:
  - name: cdo-be-app
    newName: ghcr.io/2hm1901/cdo-be-app
    newTag: 8c24285ffd8ad595aeb3a4d7aee3438e0b7886ba
