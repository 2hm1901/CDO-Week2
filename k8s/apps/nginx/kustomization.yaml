apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# App thứ hai dùng nginx để demo app-of-apps không phụ thuộc CI build image.
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# Image nginx public, không cần GitHub Actions build/push.
images:
  - name: nginx
    newName: nginx
    newTag: 1.27.3-alpine
