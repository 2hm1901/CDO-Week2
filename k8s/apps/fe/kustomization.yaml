apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# FE dùng nginx để phục vụ HTML/JS tĩnh, gọi BE API qua browser.
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml

# Image nginx public, không cần GitHub Actions build/push.
images:
  - name: nginx
    newName: nginx
    newTag: 1.27.3-alpine
