name: Validate Kubernetes Manifests

on:
  pull_request:
    # Chỉ chạy khi PR đụng tới manifest hoặc workflow validate.
    paths:
      - "k8s/**"
      - "argocd/**"
      - ".github/workflows/validate-pr.yaml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Render manifests
        # Render trước để phát hiện lỗi Kustomize trước khi merge.
        run: kustomize build k8s/apps/demo > rendered.yaml

      - name: Validate manifests
        # ignore-missing-schemas=true vì CRD như ServiceMonitor/PrometheusRule không có sẵn trong schema core.
        uses: yannh/kubeconform-action@v0.6.7
        with:
          files: rendered.yaml
          strict: true
          ignore-missing-schemas: true
