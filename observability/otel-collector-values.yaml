# Deployment mode đủ cho lab; không cần DaemonSet vì app chưa gửi telemetry node-local.
mode: deployment

image:
  # Contrib image có nhiều receiver/exporter hơn core image.
  repository: otel/opentelemetry-collector-contrib

config:
  receivers:
    # OTLP receiver mở sẵn để app/instrumentation có thể gửi trace/metric/log về sau.
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  processors:
    # Batch giảm số lần export, memory_limiter tránh collector ăn quá nhiều RAM.
    batch: {}
    memory_limiter:
      check_interval: 1s
      limit_mib: 256
  exporters:
    # Debug exporter giúp nhìn telemetry trong log collector khi học OpenTelemetry.
    debug:
      verbosity: basic
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
