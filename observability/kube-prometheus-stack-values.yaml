grafana:
  # Password lab cố định để dễ đăng nhập; không dùng cấu hình này cho production.
  adminPassword: admin123
  additionalDataSources:
    # Thêm Loki datasource để Grafana query log bằng LogQL.
    - name: Loki
      type: loki
      access: proxy
      url: http://loki-gateway.observability.svc.cluster.local
      isDefault: false

alertmanager:
  config:
    global:
      # Lab dùng SMTP Gmail làm ví dụ. Có thể đổi sang SMTP server khác nếu cần.
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: 2hm1901dev@gmail.com
      smtp_auth_username: 2hm1901dev@gmail.com
      smtp_auth_identity: 2hm1901dev@gmail.com
      # Password không commit vào Git. Alertmanager đọc từ Secret tạo thủ công trên cluster.
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/smtp-password
      smtp_require_tls: true
    route:
      # Gom alert theo tên/SLO/severity để tránh gửi quá nhiều email riêng lẻ.
      group_by: ["alertname", "slo", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h
      receiver: email-slo-alerts
      routes:
        # Critical alert gửi nhanh hơn và repeat ngắn hơn.
        - matchers:
            - severity="critical"
          receiver: email-slo-alerts
          group_wait: 10s
          repeat_interval: 30m
        # Warning alert vẫn gửi email, nhưng repeat thưa hơn để giảm noise.
        - matchers:
            - severity="warning"
          receiver: email-slo-alerts
          repeat_interval: 4h
    receivers:
      - name: email-slo-alerts
        email_configs:
          - to: 2hm1901dev@gmail.com
            send_resolved: true
  alertmanagerSpec:
    # Secret này phải được tạo trước khi sync app Prometheus:
    # kubectl -n observability create secret generic alertmanager-smtp --from-literal=smtp-password='APP_PASSWORD'
    secrets:
      - alertmanager-smtp

prometheus:
  prometheusSpec:
    # Cho phép Prometheus chọn ServiceMonitor/PrometheusRule ngoài namespace Helm release.
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    # Retention ngắn để giảm disk usage trong lab.
    retention: 6h
    resources:
      requests:
        cpu: 200m
        memory: 1Gi
      limits:
        cpu: 1
        memory: 2Gi
